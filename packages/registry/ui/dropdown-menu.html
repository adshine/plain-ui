<!--
  Plain UI - Dropdown Menu Component
  Pure HTML5 / Tailwind v4 Zero-JS Dropdown Menu with Popover API & CSS Anchor Positioning
-->

<style>
  /* Base Menu Popover Styling & Transition */
  .plain-dropdown {
    display: none;
    margin: 0;
    padding: 0.25rem;
    border: 1px solid var(--border, #e2e8f0);
    border-radius: 0.75rem;
    background-color: var(--popover, #ffffff);
    color: var(--popover-foreground, #0f172a);
    box-shadow: 0 10px 25px -5px rgb(0 0 0 / 0.1), 0 8px 10px -6px rgb(0 0 0 / 0.1);
    opacity: 0;
    transform: translateY(-4px) scale(0.98);
    transition: 
      opacity 0.15s cubic-bezier(0.16, 1, 0.3, 1),
      transform 0.15s cubic-bezier(0.16, 1, 0.3, 1),
      display 0.15s allow-discrete,
      overlay 0.15s allow-discrete;
    overflow: visible;
  }

  .plain-dropdown:popover-open {
    display: flex;
    flex-direction: column;
    opacity: 1;
    transform: translateY(0) scale(1);
  }

  @starting-style {
    .plain-dropdown:popover-open {
      opacity: 0;
      transform: translateY(-4px) scale(0.98);
    }
  }

  /* Anchor Positioning */
  .dropdown-anchor {
    position-anchor: var(--anchor-name);
    position-area: bottom span-right;
    margin-top: 0.35rem;
    position-try-fallbacks: flip-block;
  }

  .submenu-anchor {
    position-anchor: var(--sub-anchor);
    position-area: right span-bottom;
    margin-left: 0.35rem;
    position-try-fallbacks: flip-inline;
  }
</style>

<div class="space-y-12 p-6 max-w-5xl mx-auto font-sans">
  <!-- Section 1: Standard Dropdown Menu -->
  <section class="space-y-4">
    <div>
      <h3 class="text-lg font-semibold text-foreground">Dropdown Menu</h3>
      <p class="text-sm text-muted-foreground">Zero-JS anchored menu featuring shortcut badges, icons, submenus, separators, and destructive actions.</p>
    </div>

    <!-- Menu Trigger Button -->
    <button 
      type="button"
      popovertarget="main-dropdown-menu"
      style="anchor-name: --main-menu-trigger;"
      class="inline-flex items-center justify-center gap-2 px-4 py-2 text-sm font-medium text-foreground bg-background border border-input rounded-lg shadow-2xs hover:bg-accent active:scale-[0.98] transition-all cursor-pointer"
    >
      <span>Options</span>
      <svg class="w-4 h-4 text-muted-foreground" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 8.25l-7.5 7.5-7.5-7.5" />
      </svg>
    </button>

    <!-- Anchored Dropdown Menu -->
    <div 
      id="main-dropdown-menu" 
      popover="auto"
      style="--anchor-name: --main-menu-trigger;"
      class="plain-dropdown dropdown-anchor w-56 font-sans"
    >
      <!-- Menu Header -->
      <div class="px-2.5 py-1.5 text-xs font-semibold text-muted-foreground">
        My Account
      </div>

      <!-- Item 1: Profile -->
      <button 
        type="button"
        class="flex items-center justify-between w-full px-2.5 py-1.5 text-xs font-medium rounded-md text-foreground hover:bg-accent hover:text-accent-foreground cursor-pointer transition-colors text-left"
      >
        <span class="flex items-center gap-2">
          <svg class="w-3.5 h-3.5 text-muted-foreground" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" /></svg>
          Profile
        </span>
        <kbd class="px-1.5 py-0.5 text-[10px] font-mono bg-muted text-muted-foreground rounded border border-border/50">⇧⌘P</kbd>
      </button>

      <!-- Item 2: Billing -->
      <button 
        type="button"
        class="flex items-center justify-between w-full px-2.5 py-1.5 text-xs font-medium rounded-md text-foreground hover:bg-accent hover:text-accent-foreground cursor-pointer transition-colors text-left"
      >
        <span class="flex items-center gap-2">
          <svg class="w-3.5 h-3.5 text-muted-foreground" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z" /></svg>
          Billing
        </span>
        <kbd class="px-1.5 py-0.5 text-[10px] font-mono bg-muted text-muted-foreground rounded border border-border/50">⌘B</kbd>
      </button>

      <!-- Item 3: Settings -->
      <button 
        type="button"
        class="flex items-center justify-between w-full px-2.5 py-1.5 text-xs font-medium rounded-md text-foreground hover:bg-accent hover:text-accent-foreground cursor-pointer transition-colors text-left"
      >
        <span class="flex items-center gap-2">
          <svg class="w-3.5 h-3.5 text-muted-foreground" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" /><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /></svg>
          Settings
        </span>
        <kbd class="px-1.5 py-0.5 text-[10px] font-mono bg-muted text-muted-foreground rounded border border-border/50">⌘S</kbd>
      </button>

      <!-- Submenu Trigger -->
      <button 
        type="button"
        popovertarget="submenu-invite"
        style="anchor-name: --sub-invite-trigger;"
        class="flex items-center justify-between w-full px-2.5 py-1.5 text-xs font-medium rounded-md text-foreground hover:bg-accent hover:text-accent-foreground cursor-pointer transition-colors text-left"
      >
        <span class="flex items-center gap-2">
          <svg class="w-3.5 h-3.5 text-muted-foreground" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z" /></svg>
          Invite Users
        </span>
        <svg class="w-3.5 h-3.5 text-muted-foreground" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M8.25 4.5l7.5 7.5-7.5 7.5" /></svg>
      </button>

      <!-- Separator -->
      <div class="my-1 border-t border-border/60" role="separator"></div>

      <!-- Destructive Item -->
      <button 
        type="button"
        class="flex items-center justify-between w-full px-2.5 py-1.5 text-xs font-medium rounded-md text-destructive hover:bg-destructive/10 cursor-pointer transition-colors text-left"
      >
        <span class="flex items-center gap-2">
          <svg class="w-3.5 h-3.5 text-destructive" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" /></svg>
          Log out
        </span>
        <kbd class="px-1.5 py-0.5 text-[10px] font-mono bg-destructive/10 text-destructive rounded border border-destructive/20">⇧⌘Q</kbd>
      </button>
    </div>

    <!-- Nested Submenu -->
    <div 
      id="submenu-invite" 
      popover="auto"
      style="--sub-anchor: --sub-invite-trigger;"
      class="plain-dropdown submenu-anchor w-48 font-sans"
    >
      <button type="button" class="flex items-center gap-2 w-full px-2.5 py-1.5 text-xs font-medium rounded-md text-foreground hover:bg-accent transition-colors text-left">
        <svg class="w-3.5 h-3.5 text-muted-foreground" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" /></svg>
        Email Invitation
      </button>
      <button type="button" class="flex items-center gap-2 w-full px-2.5 py-1.5 text-xs font-medium rounded-md text-foreground hover:bg-accent transition-colors text-left">
        <svg class="w-3.5 h-3.5 text-muted-foreground" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1" /></svg>
        Copy Invite Link
      </button>
    </div>
  </section>

  <!-- Section 2: Checkbox & Radio Dropdown Menu -->
  <section class="space-y-4">
    <div>
      <h3 class="text-lg font-semibold text-foreground">Selection & Filter Menu</h3>
      <p class="text-sm text-muted-foreground">Dropdown with zero-JS interactive checkboxes and radio options.</p>
    </div>

    <button 
      type="button"
      popovertarget="filter-dropdown-menu"
      style="anchor-name: --filter-trigger;"
      class="inline-flex items-center justify-center gap-2 px-4 py-2 text-sm font-medium text-foreground bg-background border border-input rounded-lg shadow-2xs hover:bg-accent cursor-pointer"
    >
      <svg class="w-4 h-4 text-muted-foreground" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2.586a1 1 0 01-.293.707l-6.414 6.414a1 1 0 00-.293.707V17l-4 4v-6.586a1 1 0 00-.293-.707L3.293 7.293A1 1 0 013 6.586V4z" /></svg>
      <span>Filter & View</span>
    </button>

    <div 
      id="filter-dropdown-menu" 
      popover="auto"
      style="--anchor-name: --filter-trigger;"
      class="plain-dropdown dropdown-anchor w-60 font-sans p-2 space-y-2"
    >
      <div class="text-xs font-semibold text-muted-foreground px-1">Display Elements</div>
      
      <label class="flex items-center gap-2 px-2 py-1.5 rounded-md hover:bg-accent cursor-pointer text-xs font-medium text-foreground">
        <input type="checkbox" checked class="rounded border-input text-primary focus:ring-primary h-3.5 w-3.5" />
        Show Status Bar
      </label>

      <label class="flex items-center gap-2 px-2 py-1.5 rounded-md hover:bg-accent cursor-pointer text-xs font-medium text-foreground">
        <input type="checkbox" checked class="rounded border-input text-primary focus:ring-primary h-3.5 w-3.5" />
        Show Activity Bar
      </label>

      <div class="border-t border-border/60 my-1"></div>
      <div class="text-xs font-semibold text-muted-foreground px-1">Sort By</div>

      <label class="flex items-center gap-2 px-2 py-1.5 rounded-md hover:bg-accent cursor-pointer text-xs font-medium text-foreground">
        <input type="radio" name="sort-choice" checked class="text-primary focus:ring-primary h-3.5 w-3.5" />
        Recently Modified
      </label>

      <label class="flex items-center gap-2 px-2 py-1.5 rounded-md hover:bg-accent cursor-pointer text-xs font-medium text-foreground">
        <input type="radio" name="sort-choice" class="text-primary focus:ring-primary h-3.5 w-3.5" />
        Alphabetical (A-Z)
      </label>
    </div>
  </section>
</div>
